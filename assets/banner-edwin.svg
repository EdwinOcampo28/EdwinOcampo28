<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Edwin Ocampo — Desarrollo de software</title>
  <desc id="desc">Banner oscuro con luces turquesas, avatar de GitHub y presentación de Edwin Ocampo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07171c"/>
      <stop offset="55%" stop-color="#0b3035"/>
      <stop offset="100%" stop-color="#101d35"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity=".25"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="avatarClip"><circle cx="142" cy="170" r="72"/></clipPath>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="55" r="120" fill="#0d9488" opacity=".25" filter="url(#blur)"/>
  <circle cx="790" cy="310" r="145" fill="#0ea5e9" opacity=".17" filter="url(#blur)"/>
  <rect x="14" y="14" width="1172" height="312" rx="22" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <path d="M270 55 C460 10 620 95 820 45 S1050 40 1140 95" fill="none" stroke="#2dd4bf" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="142" cy="170" r="82" fill="#0f766e" opacity=".45"/>
  <circle cx="142" cy="170" r="76" fill="#07171c" stroke="#2dd4bf" stroke-width="4"/>
