  <text x="256" y="158" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">Edwin Ocampo</text>
  <text x="260" y="198" fill="#b8f7ef" font-family="Segoe UI, Arial, sans-serif" font-size="23">Desarrollo de software · Proyectos digitales</text>
